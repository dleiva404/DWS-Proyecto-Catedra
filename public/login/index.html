<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Grupo Calma - Iniciar sesión</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <main class="login-container">

        <section class="login-brand">

            <div class="logo-container">
                <img src="../assets/Logo.jpeg" alt="Invercalma - Grupo Calma">
            </div>

            <div class="brand-name">GRUPO CALMA</div>
            <div class="brand-subtitle">Recursos Humanos</div>

            <div class="brand-title">
                Recursos<br>
                Humanos
            </div>

            <div class="brand-description">
                Portal de gestiones
            </div>

        </section>

        <section class="login-form-container">

            <div class="login-form">

                <h1>Bienvenido</h1>

                <p class="login-subtitle">
                    Inicia sesión con tu usuario corporativo
                </p>

                <form id="loginForm">

                    <label for="usuario">USUARIO</label>
                    <input type="text" id="usuario" placeholder="Ingresa tu usuario" required>

                    <label for="contrasena">CONTRASEÑA</label>
                    <input type="password" id="contrasena" placeholder="Ingresa tu contraseña" required>

                    <div class="login-options">
                        <label class="remember">
                            <input type="checkbox" id="recordarme">
                            <span>Recordarme</span>
                        </label>

                        <a href="#" id="olvidaste">¿Olvidaste tu contraseña?</a>
                    </div>

                    <button type="submit">Iniciar sesión</button>

                    <div id="mensaje" class="mensaje"></div>

                </form>

                <div class="login-divider">
                    <span></span>
                    <b>•</b>
                    <span></span>
                </div>

                <p class="contacto">
                    ¿No tienes cuenta?
                    <strong>Contacta a RRHH</strong>
                </p>

            </div>

        </section>

    </main>

    <script src="app.js"></script>
</body>

</html>
