<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grupo Calma - Recuperar contraseña</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <main class="login-container">

        <section class="login-brand">

            <div class="logo-container">
                <img src="../assets/logo.png" alt="Invercalma - Grupo Calma">
            </div>

            <div class="brand-name">GRUPO CALMA</div>
            <div class="brand-subtitle">Recursos Humanos</div>

            <div class="brand-title">
                Recuperar<br>
                contraseña
            </div>

            <div class="brand-description">
                Portal de gestiones
            </div>

        </section>

        <section class="login-form-container">

            <div class="login-form">

                <h1>¿Olvidaste tu contraseña?</h1>

                <p class="login-subtitle">
                    Ingresa tu correo corporativo y te enviaremos las instrucciones para restablecer tu contraseña.
                </p>

                <form id="formOlvide">

                    <label for="correo">CORREO ELECTRÓNICO</label>
                    <input
                        type="email"
                        id="correo"
                        placeholder="Ingresa tu correo electrónico"
                        required
                    >

                    <button type="submit">Enviar instrucciones</button>

                    <div id="mensaje" class="mensaje"></div>

                </form>

                <div class="login-divider">
                    <span></span>
                    <b>•</b>
                    <span></span>
                </div>

                <p class="contacto">
                    ¿Recordaste tu contraseña?
                    <strong><a href="index.html">Iniciar sesión</a></strong>
                </p>

            </div>

        </section>

    </main>

    <script src="recuperar.js"></script>
</body>

</html>
