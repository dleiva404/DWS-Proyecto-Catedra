<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grupo Calma - Nueva contraseña</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <main class="login-container">

        <section class="login-brand">

            <div class="logo-container">
                <img src="../assets/logo.png" alt="Invercalma - Grupo Calma">
            </div>

            <div class="brand-name">GRUPO CALMA</div>
            <div class="brand-subtitle">Recursos Humanos</div>

            <div class="brand-title">
                Nueva<br>
                Contraseña
            </div>

            <div class="brand-description">
                Portal de gestiones
            </div>

        </section>

        <section class="login-form-container">

            <div class="login-form">

                <h1>Restablecer contraseña</h1>

                <p class="login-subtitle">
                    Ingresa tu nueva contraseña para recuperar el acceso a tu cuenta.
                </p>

                <form id="formRestablecer">

                    <label for="contrasena">NUEVA CONTRASEÑA</label>
                    <input type="password" id="contrasena" placeholder="Mínimo 8 caracteres" minlength="8" required>

                    <label for="confirmarContrasena">CONFIRMAR CONTRASEÑA</label>
                    <input type="password" id="confirmarContrasena" placeholder="Confirma tu contraseña" minlength="8"
                        required>

                    <button type="submit">Cambiar contraseña</button>

                    <div id="mensaje" class="mensaje"></div>

                </form>

                <div class="login-divider">
                    <span></span>
                    <b>•</b>
                    <span></span>
                </div>

                <p class="contacto">
                    <strong><a href="index.html">Volver al inicio de sesión</a></strong>
                </p>

            </div>

        </section>

    </main>

    <script src="recuperar.js"></script>
</body>

</html>
